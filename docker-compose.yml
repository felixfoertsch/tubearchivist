# Development compose only; production deployment must use the release image workflow.
services:
  tubearchivist:
    container_name: tubearchivist
    restart: unless-stopped
    image: tubearchivist-postgres-dev
    build: .
    pull_policy: never
    ports:
      - 8000:8000
    volumes:
      - media:/youtube
      - cache:/cache
    environment:
      - POSTGRES_HOST=archivist-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tubearchivist
      - POSTGRES_USER=tubearchivist
      - POSTGRES_PASSWORD=app-secret-change-me
      - TA_HOST=http://tubearchivist.local:8000
      - TA_USERNAME=tubearchivist
      - TA_PASSWORD=verysecret
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      archivist-postgres:
        condition: service_healthy
  archivist-postgres:
    image: postgres:18.6-trixie
    container_name: archivist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ta_bootstrap
      POSTGRES_PASSWORD: bootstrap-secret-change-me
      POSTGRES_APP_PASSWORD: app-secret-change-me
    volumes:
      - postgres:/var/lib/postgresql
      - ./docker_assets/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ta_bootstrap -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  media:
  cache:
  postgres:
