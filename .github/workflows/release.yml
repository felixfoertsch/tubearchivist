name: Fork release

on:
  push:
    branches: [develop, 'fork/patch-stack']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'felixfoertsch/tubearchivist' && github.ref == 'refs/heads/fork/patch-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout proposed patch stack
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test upstream replay safeguards
        run: python3 -B -m unittest discover -s .github/tests -v
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libldap2-dev libsasl2-dev libssl-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate without pushing branches or images
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend
          pre-commit run --all-files
          pytest backend
          npm run --prefix frontend build:deploy
          git diff --exit-code

  release:
    if: github.repository == 'felixfoertsch/tubearchivist' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout current fork tip
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
      - name: Test upstream replay safeguards
        run: python3 -B -m unittest discover -s .github/tests -v
      - name: Replay every fork patch on current upstream
        id: source
        run: |
          cp .github/rebase_upstream.sh "$RUNNER_TEMP/rebase-upstream.sh"
          bash "$RUNNER_TEMP/rebase-upstream.sh"
      - name: Install system dependencies
        if: steps.source.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libldap2-dev libsasl2-dev libssl-dev
      - name: Set up Python
        if: steps.source.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - name: Set up Node.js
        if: steps.source.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.source.outputs.publish == 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend
      - name: Validate the replayed source
        if: steps.source.outputs.publish == 'true'
        run: |
          python -B -m unittest discover -s .github/tests -v
          pre-commit run --all-files
          pytest backend
          npm run --prefix frontend build:deploy
          git diff --exit-code
      - name: Set up QEMU
        if: steps.source.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.source.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: steps.source.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release metadata
        if: steps.source.outputs.publish == 'true'
        id: release
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=fork-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build candidate without moving deployment tags
        if: steps.source.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:sha-${{ steps.source.outputs.sha }}
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Atomically publish the validated patch stack and upstream boundary
        if: steps.source.outputs.publish == 'true'
        env:
          ORIGINAL_SHA: ${{ steps.source.outputs.original_sha }}
          ORIGINAL_BASE: ${{ steps.source.outputs.original_base }}
          UPSTREAM: ${{ steps.source.outputs.upstream_sha }}
        run: |
          git push --atomic \
            --force-with-lease="refs/heads/develop:$ORIGINAL_SHA" \
            --force-with-lease="refs/heads/upstream-base:$ORIGINAL_BASE" \
            origin HEAD:refs/heads/develop "$UPSTREAM:refs/heads/upstream-base"
      # GITHUB_TOKEN pushes do not trigger another workflow; promote this exact build here.
      - name: Promote the validated image to latest and develop
        if: steps.source.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:develop" "$IMAGE@$DIGEST"
      - name: Create fork prerelease
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.source.outputs.sha }}
          UPSTREAM: ${{ steps.source.outputs.upstream_sha }}
        run: |
          notes="$RUNNER_TEMP/fork-release-notes.md"
          printf 'Unofficial fork build of commit `%s`.\n\n' "$COMMIT" > "$notes"
          printf 'Fork patches replayed on `tubearchivist/tubearchivist:develop` at `%s`.\n\n' "$UPSTREAM" >> "$notes"
          git log --reverse --format='- `%h` %s' "$UPSTREAM..$COMMIT" >> "$notes"
          printf '\nDocker image (amd64/arm64): `%s:%s`\n\n' "$IMAGE" "$TAG" >> "$notes"
          printf 'Immutable image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$notes"
          gh release create "$TAG" --target "$COMMIT" \
            --title "Fork build $TAG" --notes-file "$notes" --prerelease
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain failed release
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo '::error::Fork release failed. Inspect the first failed step; no patch is skipped automatically.'
          {
            printf '\n## Fork release failed\n\nSee %s for the failing patch or build step.\n\n' "$RUN_URL"
            printf 'Patch, validation, and candidate-build failures leave the remote patch stack and deployment tags unchanged.\n'
            printf 'A concurrent push rejects the atomic branch update before image promotion.\n'
            printf 'A later promotion or release-note failure can occur after the validated branch/image was updated; inspect the completed steps.\n'
          } >> "$GITHUB_STEP_SUMMARY"
