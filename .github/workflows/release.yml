name: Fork release

on:
  push:
    branches: [develop]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'felixfoertsch/tubearchivist' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge upstream develop without discarding fork changes
        id: source
        run: |
          git fetch --no-tags https://github.com/tubearchivist/tubearchivist.git develop
          upstream_sha=$(git rev-parse FETCH_HEAD)
          changed=false
          if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if ! git merge --no-ff "$upstream_sha" -m "Merge upstream develop ($upstream_sha)"; then
              git merge --abort
              echo '::error::Upstream merge conflict. Resolve manually; no changes were pushed or released.'
              exit 1
            fi
            changed=true
          fi
          publish=true
          # Retry unpublished commits after a failed build, but skip unchanged releases.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && git tag --points-at HEAD --list 'fork-*' | grep -q .; then
            publish=false
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = false ]; then
            echo 'Upstream is already included and this commit is released; nothing to build.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install system dependencies
        if: steps.source.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libldap2-dev libsasl2-dev libssl-dev
      - name: Set up Python
        if: steps.source.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - name: Set up Node.js
        if: steps.source.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.source.outputs.publish == 'true'
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend
      - name: Validate merged source before pushing or publishing
        if: steps.source.outputs.publish == 'true'
        run: |
          pre-commit run --all-files
          pytest backend
          npm run --prefix frontend build:deploy
      - name: Push validated upstream merge
        if: steps.source.outputs.changed == 'true'
        run: git push origin HEAD:refs/heads/develop
      # GITHUB_TOKEN pushes do not trigger another push workflow. Build here instead.
      - name: Set up QEMU
        if: steps.source.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.source.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: steps.source.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release metadata
        if: steps.source.outputs.publish == 'true'
        id: release
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=fork-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        if: steps.source.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:develop
            ${{ steps.release.outputs.image }}:sha-${{ steps.source.outputs.sha }}
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create fork prerelease
        if: steps.source.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.source.outputs.sha }}
          UPSTREAM: ${{ steps.source.outputs.upstream_sha }}
        run: |
          printf 'Unofficial fork build of commit `%s`.\n\n' "$COMMIT" > release-notes.md
          printf 'Includes upstream `tubearchivist/tubearchivist:develop` at `%s`.\n\n' "$UPSTREAM" >> release-notes.md
          printf 'Docker image (amd64/arm64): `%s:%s`\n\n' "$IMAGE" "$TAG" >> release-notes.md
          printf 'Immutable image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> release-notes.md
          gh release create "$TAG" --target "$COMMIT" \
            --title "Fork build $TAG" --notes-file release-notes.md --prerelease
