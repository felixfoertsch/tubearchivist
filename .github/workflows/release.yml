name: Fork release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'felixfoertsch/tubearchivist' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set release metadata
        id: release
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=fork-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:latest
            ${{ steps.release.outputs.image }}:develop
            ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create fork prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ steps.release.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Unofficial fork build of commit `%s`.\n\n' "$GITHUB_SHA" > release-notes.md
          printf 'Docker image (amd64/arm64): `%s:%s`\n\n' "$IMAGE" "$TAG" >> release-notes.md
          printf 'Immutable image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Fork build $TAG" --notes-file release-notes.md --prerelease
