name: Patched Tube Archivist

on:
  push:
    branches: [automation]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: tubearchivist-downstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'felixfoertsch/tubearchivist'
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, nightly]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation
          fetch-depth: 0
          persist-credentials: true
      - name: Test automation
        run: python3 -B -m unittest discover -s .automation/tests -v
      - name: Capture publication leases
        id: leases
        run: |
          echo "automation=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main=$(git ls-remote origin refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Resolve official source
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .automation/channels.py '${{ matrix.channel }}'
      - name: Rebuild upstream plus patches
        id: source
        run: python3 .automation/sync.py --upstream-ref '${{ steps.channel.outputs.ref }}'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libldap2-dev libsasl2-dev libssl-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate rebuilt source
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend
          pre-commit run --all-files
          pytest backend
          npm run --prefix frontend build:deploy
          git diff --exit-code
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.channel }}-sha-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
      - name: Reject changed automation or upstream
        env:
          EXPECTED_AUTOMATION: ${{ steps.leases.outputs.automation }}
          CHANNEL: ${{ matrix.channel }}
          UPSTREAM_REF: ${{ steps.channel.outputs.ref }}
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
          RELEASE_TAG: ${{ steps.channel.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/automation | cut -f1)" = "$EXPECTED_AUTOMATION"
          git fetch --no-tags https://github.com/tubearchivist/tubearchivist.git "$UPSTREAM_REF"
          test "$(git rev-parse FETCH_HEAD^{commit})" = "$UPSTREAM_SHA"
          if [ "$CHANNEL" = stable ]; then
            test "$(gh api repos/tubearchivist/tubearchivist/releases/latest --jq .tag_name)" = "$RELEASE_TAG"
          fi
      - name: Update generated main from nightly source
        if: matrix.channel == 'nightly'
        env:
          EXPECTED_MAIN: ${{ steps.leases.outputs.main }}
          EXPECTED_AUTOMATION: ${{ steps.leases.outputs.automation }}
        run: |
          test "$(git ls-remote origin refs/heads/automation | cut -f1)" = "$EXPECTED_AUTOMATION"
          git push --force-with-lease="refs/heads/main:$EXPECTED_MAIN" origin HEAD:refs/heads/main
      - name: Promote validated candidate
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          if [ "$CHANNEL" = stable ]; then
            tags="latest stable $VERSION"
          else
            tags="nightly edge develop"
          fi
          args=()
          for tag in $tags; do args+=(--tag "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
      - name: Summary
        run: |
          echo "## ${{ matrix.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Official source: \`${{ steps.channel.outputs.ref }}\` at \`${{ steps.source.outputs.upstream_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated image: \`ghcr.io/${{ github.repository }}@${{ steps.candidate.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'stable: latest/stable/version. nightly: nightly/edge/develop.' >> "$GITHUB_STEP_SUMMARY"
